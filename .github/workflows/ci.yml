name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: gcp-ml-inference-demo-eh01
          workload_identity_provider: projects/717939482417/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@gcp-ml-inference-demo-eh01.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud authentication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Active account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "Configured project:"
          gcloud config get-value project
          echo "Testing access token generation:"
          gcloud auth print-access-token > /dev/null
          echo "Google Cloud authentication succeeded."

      - name: Verify Cloud Storage read access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Listing model files in Cloud Storage:"
          gcloud storage ls gs://gcp-ml-inference-demo-eh01-models/models/

      - name: Verify Cloud Run read access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Checking Cloud Run service:"

          SERVICE_NAMES=$(gcloud run services list \
            --region=asia-northeast1 \
            --project=gcp-ml-inference-demo-eh01 \
            --format="value(name)")

          if printf '%s\n' "${SERVICE_NAMES}" | grep -Fxq "gcp-ml-inference-demo"; then
            echo "Cloud Run service exists."
          else
            echo "Cloud Run service does not exist."
          fi
      - name: Verify Artifact Registry read access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Listing container images in Artifact Registry:"

          gcloud artifacts docker images list \
            asia-northeast1-docker.pkg.dev/gcp-ml-inference-demo-eh01/ml-demo \
            --project=gcp-ml-inference-demo-eh01

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Evaluate models
        run: |
          python src/compare_models.py \
            --eval-data data/challenge_data.csv \
            --current-version v3

      - name: Upload selected model if new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SELECTED_VERSION=$(python -c "import json; d=json.load(open('selected_model.json')); print(d['selected_version'])")
          MODEL_FILE=$(python -c "import json; d=json.load(open('selected_model.json')); print(d['model_file'])")
          DESTINATION="gs://gcp-ml-inference-demo-eh01-models/models/${SELECTED_VERSION}/model.joblib"

          echo "=== Model Upload ==="
          echo "Selected version: ${SELECTED_VERSION}"
          echo "Local model:      ${MODEL_FILE}"
          echo "Destination:      ${DESTINATION}"

          if [ ! -f "${MODEL_FILE}" ]; then
            echo "ERROR: Local model file does not exist."
            exit 1
          fi

          if gcloud storage ls "${DESTINATION}" > /dev/null 2>&1; then
            echo "Destination already exists."
            echo "Upload skipped."
          else
            echo "Destination does not exist."
            echo "Uploading new model..."

            gcloud storage cp \
              "${MODEL_FILE}" \
              "${DESTINATION}" \
              --if-generation-match=0

            echo "Upload completed."

            echo "Verifying uploaded model:"
            gcloud storage ls "${DESTINATION}"
          fi

      - name: Write model evaluation summary
        run: |
          echo "## Model evaluation result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat selected_model.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: |
            evaluation_results.csv
            selected_model.json
            history/evaluation_results_*.csv
            history/selected_model_*.json
          if-no-files-found: error
          retention-days: 14